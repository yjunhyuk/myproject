<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Note Prototype</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a1a;color:#fff;font-family:system-ui;height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none;}

/* 툴바 */
#toolbar{height:52px;background:#111;border-bottom:1px solid #333;display:flex;align-items:center;gap:4px;padding:0 12px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#toolbar::-webkit-scrollbar{display:none;}
.tb-group{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.sep{width:1px;height:28px;background:#333;margin:0 6px;flex-shrink:0;}

/* 툴 버튼 */
.tool-btn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;color:#aaa;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;flex-shrink:0;}
.tool-btn:hover{background:#2a2a2a;color:#fff;}
.tool-btn.active{background:#fff;color:#000;border-color:#fff;}
.tool-btn.eraser.active{background:#f43f5e;color:#fff;border-color:#f43f5e;}

/* 펜 굵기 */
.size-btn{width:36px;height:36px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.size-btn:hover{background:#2a2a2a;}
.size-btn.active{background:#2a2a2a;border-color:#555;}
.size-dot{border-radius:50%;background:#fff;}

/* 색상 팔레트 */
.color-btn{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0;}
.color-btn:hover{transform:scale(1.15);}
.color-btn.active{border-color:#fff;transform:scale(1.2);}

/* 슬라이더 */
.opacity-slider{width:80px;-webkit-appearance:none;height:4px;border-radius:2px;background:#333;outline:none;cursor:pointer;}
.opacity-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;}
.slider-label{font-size:11px;color:#666;white-space:nowrap;}

/* 캔버스 영역 */
#canvas-wrap{flex:1;overflow:auto;background:#2a2a2a;position:relative;scrollbar-width:thin;scrollbar-color:#444 transparent;}
#canvas-wrap::-webkit-scrollbar{width:6px;height:6px;}
#canvas-wrap::-webkit-scrollbar-thumb{background:#444;border-radius:3px;}

#canvas-container{position:relative;margin:20px auto;}
.page-canvas{display:block;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);cursor:crosshair;touch-action:none;}
.page-canvas.eraser-cursor{cursor:cell;}

/* 페이지 구분선 */
.page-gap{height:16px;background:transparent;}

/* 하단 상태바 */
#statusbar{height:36px;background:#111;border-top:1px solid #333;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
.status-left{display:flex;align-items:center;gap:12px;}
.status-right{display:flex;align-items:center;gap:8px;}
.status-text{font-size:11px;color:#666;}
.zoom-btn{width:28px;height:28px;border-radius:6px;border:1px solid #333;background:none;color:#888;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.zoom-btn:hover{background:#2a2a2a;color:#fff;}
#zoom-display{font-size:11px;color:#666;min-width:36px;text-align:center;}

/* 페이지 추가 버튼 */
#add-page-btn{position:fixed;bottom:52px;right:20px;width:48px;height:48px;border-radius:50%;background:#fff;border:none;color:#000;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:all .2s;display:flex;align-items:center;justify-content:center;z-index:100;}
#add-page-btn:hover{transform:scale(1.08);}

/* 저장 버튼 */
#save-btn{padding:6px 14px;border-radius:8px;border:1px solid #444;background:none;color:#888;font-size:12px;cursor:pointer;transition:all .15s;}
#save-btn:hover{background:#2a2a2a;color:#fff;}

/* 핀치줌 인디케이터 */
#zoom-indicator{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:4px 12px;border-radius:100px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:200;}
#zoom-indicator.show{opacity:1;}

/* 지우개 커서 */
#eraser-cursor{position:fixed;border:2px solid rgba(244,63,94,.8);border-radius:50%;pointer-events:none;z-index:9999;display:none;transform:translate(-50%,-50%);}
</style>
</head>
<body>

<!-- 툴바 -->
<div id="toolbar">
    <div class="tb-group">
        <!-- 도구 선택 -->
        <button class="tool-btn active" id="btn-pen" onclick="setTool('pen')" title="펜">✏️</button>
        <button class="tool-btn" id="btn-highlighter" onclick="setTool('highlighter')" title="형광펜">🖊</button>
        <button class="tool-btn eraser" id="btn-eraser" onclick="setTool('eraser')" title="지우개">⬜</button>
        <button class="tool-btn" id="btn-select" onclick="setTool('select')" title="선택">🔲</button>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
        <!-- 펜 굵기 -->
        <button class="size-btn active" id="sz-1" onclick="setSize(1.5)" title="가는 펜">
            <div class="size-dot" style="width:3px;height:3px;"></div>
        </button>
        <button class="size-btn" id="sz-2" onclick="setSize(3)" title="보통 펜">
            <div class="size-dot" style="width:6px;height:6px;"></div>
        </button>
        <button class="size-btn" id="sz-3" onclick="setSize(6)" title="굵은 펜">
            <div class="size-dot" style="width:10px;height:10px;"></div>
        </button>
        <button class="size-btn" id="sz-4" onclick="setSize(12)" title="매우 굵은 펜">
            <div class="size-dot" style="width:16px;height:16px;"></div>
        </button>
    </div>
    <div class="sep"></div>
    <div class="tb-group" id="color-palette">
        <!-- 색상 -->
        <button class="color-btn active" data-color="#000000" style="background:#000;border-color:#fff;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#1a1aff" style="background:#1a1aff;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#e53e3e" style="background:#e53e3e;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#38a169" style="background:#38a169;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#d97706" style="background:#d97706;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#7c3aed" style="background:#7c3aed;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#db2777" style="background:#db2777;" onclick="setColor(this)"></button>
        <button class="color-btn" data-color="#555555" style="background:#555;" onclick="setColor(this)"></button>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
        <span class="slider-label">불투명도</span>
        <input type="range" class="opacity-slider" id="opacity-slider" min="10" max="100" value="100" oninput="setOpacity(this.value)">
        <span class="slider-label" id="opacity-val">100%</span>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
        <button class="tool-btn" onclick="undo()" title="실행취소">↩</button>
        <button class="tool-btn" onclick="redo()" title="다시실행">↪</button>
        <button class="tool-btn" onclick="clearPage()" title="현재 페이지 지우기">🗑</button>
    </div>
    <div class="sep"></div>
    <div class="tb-group">
        <button id="save-btn" onclick="saveAllPages()">💾 저장</button>
    </div>
</div>

<!-- 캔버스 영역 -->
<div id="canvas-wrap">
    <div id="canvas-container"></div>
</div>

<!-- 하단 상태바 -->
<div id="statusbar">
    <div class="status-left">
        <span class="status-text" id="page-info">페이지 1 / 1</span>
        <span class="status-text" id="tool-info">펜 · 1.5px</span>
    </div>
    <div class="status-right">
        <button class="zoom-btn" onclick="adjustZoom(-0.25)">−</button>
        <span id="zoom-display">100%</span>
        <button class="zoom-btn" onclick="adjustZoom(0.25)">＋</button>
        <button class="zoom-btn" onclick="resetZoom()" title="기본 크기">⊡</button>
    </div>
</div>

<button id="add-page-btn" onclick="addPage()" title="페이지 추가">＋</button>
<div id="zoom-indicator"></div>
<div id="eraser-cursor"></div>

<script>
'use strict';

/* ── 상태 ── */
let tool = 'pen';
let penSize = 1.5;
let penColor = '#000000';
let penOpacity = 1.0;
let currentZoom = 1.0;
let pages = [];         // {canvas, ctx, history, redoStack}
let currentPageIdx = 0;

/* ── 스트로크 관련 ── */
let isDrawing = false;
let lastX = 0, lastY = 0;
let lastPressure = 0;
let currentStroke = [];
let strokeHistory = [];  // 현재 페이지 스트로크 히스토리
let redoStack = [];

/* ── 핀치줌 ── */
let pinchDist = 0;
let isPinching = false;
let pinchMidX = 0, pinchMidY = 0;

/* ── 캔버스 크기 (A4 비율) ── */
const PAGE_W = 794;
const PAGE_H = 1123;

/* ── 초기화 ── */
function init() {
    addPage();
    updateZoom();
}

function addPage() {
    const container = document.getElementById('canvas-container');

    if (pages.length > 0) {
        const gap = document.createElement('div');
        gap.className = 'page-gap';
        container.appendChild(gap);
    }

    const canvas = document.createElement('canvas');
    canvas.className = 'page-canvas';
    canvas.width = PAGE_W;
    canvas.height = PAGE_H;
    canvas.style.width = PAGE_W * currentZoom + 'px';
    canvas.style.height = PAGE_H * currentZoom + 'px';

    const page = {
        canvas,
        ctx: canvas.getContext('2d'),
        strokes: [],   // 완성된 스트로크 배열
        redoStack: []
    };

    // 흰 배경 + 줄 그리기
    drawPageBg(page);
    setupCanvasEvents(canvas, pages.length);

    container.appendChild(canvas);
    pages.push(page);

    currentPageIdx = pages.length - 1;
    updatePageInfo();

    // 새 페이지로 스크롤
    setTimeout(() => {
        canvas.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
}

function drawPageBg(page) {
    const { ctx } = page;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, PAGE_W, PAGE_H);

    // 연한 줄
    ctx.strokeStyle = 'rgba(180,200,220,0.4)';
    ctx.lineWidth = 0.8;
    const lineSpacing = 32;
    for (let y = 60; y < PAGE_H; y += lineSpacing) {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(PAGE_W - 30, y);
        ctx.stroke();
    }

    // 왼쪽 마진선
    ctx.strokeStyle = 'rgba(255,100,100,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(70, 0);
    ctx.lineTo(70, PAGE_H);
    ctx.stroke();
}

/* ── 이벤트 설정 ── */
function setupCanvasEvents(canvas, pageIdx) {
    // 포인터 이벤트 (S펜/마우스/터치 통합)
    canvas.addEventListener('pointerdown', e => onPointerDown(e, pageIdx), { passive: false });
    canvas.addEventListener('pointermove', e => onPointerMove(e, pageIdx), { passive: false });
    canvas.addEventListener('pointerup', e => onPointerUp(e, pageIdx), { passive: false });
    canvas.addEventListener('pointercancel', e => onPointerUp(e, pageIdx), { passive: false });
    canvas.addEventListener('pointerleave', e => onPointerUp(e, pageIdx), { passive: false });

    // 핀치줌 (절대 건드리지 말 것)
    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove', onTouchMove, { passive: false });
    canvas.addEventListener('touchend', onTouchEnd, { passive: false });
}

/* ── 포인터 이벤트 핸들러 ── */
function getCanvasPos(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) / currentZoom,
        y: (e.clientY - rect.top) / currentZoom
    };
}

function onPointerDown(e, pageIdx) {
    if (isPinching) return;
    if (e.pointerType === 'touch' && e.isPrimary === false) return;

    e.preventDefault();
    currentPageIdx = pageIdx;
    const page = pages[pageIdx];
    const pos = getCanvasPos(e, page.canvas);

    isDrawing = true;
    lastX = pos.x;
    lastY = pos.y;
    lastPressure = e.pressure || 0.5;
    currentStroke = [{ x: pos.x, y: pos.y, p: lastPressure }];

    page.canvas.setPointerCapture(e.pointerId);

    if (tool === 'eraser') {
        showEraserCursor(e.clientX, e.clientY, penSize * 4);
        eraseAt(page, pos.x, pos.y);
    }
}

function onPointerMove(e, pageIdx) {
    if (!isDrawing || isPinching) return;
    if (e.pointerType === 'touch' && e.isPrimary === false) return;

    e.preventDefault();
    const page = pages[pageIdx];

    // getCoalescedEvents로 중간 좌표 모두 처리 (끊김 방지 핵심)
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

    for (const ev of events) {
        const pos = getCanvasPos(ev, page.canvas);
        const pressure = ev.pressure > 0 ? ev.pressure : 0.5;

        if (tool === 'eraser') {
            showEraserCursor(ev.clientX, ev.clientY, penSize * 4);
            eraseAt(page, pos.x, pos.y);
        } else {
            drawSegment(page, lastX, lastY, pos.x, pos.y, lastPressure, pressure);
            currentStroke.push({ x: pos.x, y: pos.y, p: pressure });
        }

        lastX = pos.x;
        lastY = pos.y;
        lastPressure = pressure;
    }
}

function onPointerUp(e, pageIdx) {
    if (!isDrawing) return;
    isDrawing = false;
    hideEraserCursor();

    const page = pages[pageIdx];

    if (tool !== 'eraser' && currentStroke.length > 0) {
        // 점 찍기 (탭)
        if (currentStroke.length === 1) {
            const { x, y, p } = currentStroke[0];
            drawDot(page, x, y, p);
        }
        // 스트로크 히스토리 저장
        page.strokes.push({
            tool, color: penColor, opacity: penOpacity,
            size: penSize, points: [...currentStroke]
        });
        page.redoStack = [];
    } else if (tool === 'eraser') {
        // 지우개 후 히스토리 스냅샷
        page.strokes.push({ tool: 'eraser-snap', snapshot: getSnapshot(page) });
        page.redoStack = [];
    }

    currentStroke = [];
}

/* ── 실제 그리기 ── */
function drawSegment(page, x1, y1, x2, y2, p1, p2) {
    const { ctx } = page;
    const isHighlighter = tool === 'highlighter';
    const avgP = (p1 + p2) / 2;
    const w = penSize * (isHighlighter ? 10 : 1) * (0.5 + avgP * 0.5);

    ctx.save();
    ctx.globalAlpha = isHighlighter ? penOpacity * 0.35 : penOpacity;
    ctx.strokeStyle = penColor;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
}

function drawDot(page, x, y, p) {
    const { ctx } = page;
    const r = penSize * (0.5 + p * 0.5);
    ctx.save();
    ctx.globalAlpha = penOpacity;
    ctx.fillStyle = penColor;
    ctx.beginPath();
    ctx.arc(x, y, r / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

/* ── 지우개 ── */
function eraseAt(page, x, y) {
    const { ctx } = page;
    const r = penSize * 4;
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 배경 복원 (지운 자리에 흰색)
    const ctx2 = page.canvas.getContext('2d');
    ctx2.save();
    ctx2.globalCompositeOperation = 'destination-atop';
    ctx2.fillStyle = '#fff';
    ctx2.fillRect(0, 0, PAGE_W, PAGE_H);
    ctx2.restore();

    // 더 나은 지우개: 해당 영역만 흰색으로
    page.ctx.save();
    page.ctx.globalCompositeOperation = 'source-over';
    page.ctx.fillStyle = '#ffffff';
    page.ctx.beginPath();
    page.ctx.arc(x, y, r, 0, Math.PI * 2);
    page.ctx.fill();
    page.ctx.restore();
}

/* ── 스냅샷 (실행취소용) ── */
function getSnapshot(page) {
    return page.ctx.getImageData(0, 0, PAGE_W, PAGE_H);
}

/* ── 실행취소 / 다시실행 ── */
function undo() {
    const page = pages[currentPageIdx];
    if (!page.strokes.length) return;

    const removed = page.strokes.pop();
    page.redoStack.push(removed);
    redrawPage(page);
}

function redo() {
    const page = pages[currentPageIdx];
    if (!page.redoStack.length) return;

    const stroke = page.redoStack.pop();
    page.strokes.push(stroke);
    redrawPage(page);
}

function redrawPage(page) {
    // 배경 다시 그리기
    drawPageBg(page);

    // 모든 스트로크 재생
    for (const s of page.strokes) {
        if (s.tool === 'eraser-snap') {
            page.ctx.putImageData(s.snapshot, 0, 0);
            continue;
        }
        if (!s.points || s.points.length === 0) continue;

        const isHL = s.tool === 'highlighter';
        page.ctx.save();
        page.ctx.globalAlpha = isHL ? s.opacity * 0.4 : s.opacity;
        page.ctx.strokeStyle = s.color;
        page.ctx.lineCap = 'round';
        page.ctx.lineJoin = 'round';

        if (s.points.length === 1) {
            const { x, y, p } = s.points[0];
            const r = s.size * (0.5 + p * 0.5);
            page.ctx.fillStyle = s.color;
            page.ctx.beginPath();
            page.ctx.arc(x, y, r / 2, 0, Math.PI * 2);
            page.ctx.fill();
        } else {
            for (let i = 0; i < s.points.length - 1; i++) {
                const p1 = s.points[i], p2 = s.points[i + 1];
                const avgP = (p1.p + p2.p) / 2;
                const w = s.size * (isHL ? 8 : 1) * (0.4 + avgP * 0.6);
                page.ctx.lineWidth = w;
                page.ctx.beginPath();
                page.ctx.moveTo(p1.x, p1.y);
                const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
                page.ctx.quadraticCurveTo(p1.x, p1.y, mx, my);
                page.ctx.stroke();
            }
        }
        page.ctx.restore();
    }
}

function clearPage() {
    const page = pages[currentPageIdx];
    if (!confirm('현재 페이지를 지울까요?')) return;
    page.strokes = [];
    page.redoStack = [];
    drawPageBg(page);
}

/* ── 지우개 커서 UI ── */
function showEraserCursor(cx, cy, size) {
    const el = document.getElementById('eraser-cursor');
    const sz = Math.max(8, size * currentZoom * 2);
    el.style.display = 'block';
    el.style.width = sz + 'px';
    el.style.height = sz + 'px';
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
}
function hideEraserCursor() {
    document.getElementById('eraser-cursor').style.display = 'none';
}

/* ── 핀치줌 (절대 건드리지 말 것) ── */
function onTouchStart(e) {
    if (e.touches.length === 2) {
        isPinching = true;
        isDrawing = false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchDist = Math.hypot(dx, dy);
        pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        e.preventDefault();
    }
}
function onTouchMove(e) {
    if (isPinching && e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const newDist = Math.hypot(dx, dy);
        const ratio = newDist / pinchDist;
        const newZoom = Math.min(4, Math.max(0.25, currentZoom * ratio));
        pinchDist = newDist;
        currentZoom = newZoom;
        updateZoom();
        showZoomIndicator();
        e.preventDefault();
    }
}
function onTouchEnd(e) {
    if (e.touches.length < 2) {
        isPinching = false;
    }
}

/* ── 줌 ── */
function adjustZoom(delta) {
    currentZoom = Math.min(4, Math.max(0.25, currentZoom + delta));
    updateZoom();
    showZoomIndicator();
}
function resetZoom() {
    currentZoom = 1.0;
    updateZoom();
    showZoomIndicator();
}
function updateZoom() {
    pages.forEach(p => {
        p.canvas.style.width = PAGE_W * currentZoom + 'px';
        p.canvas.style.height = PAGE_H * currentZoom + 'px';
    });
    document.getElementById('zoom-display').textContent = Math.round(currentZoom * 100) + '%';

    const container = document.getElementById('canvas-container');
    container.style.width = PAGE_W * currentZoom + 'px';
}

let zoomTimer = null;
function showZoomIndicator() {
    const el = document.getElementById('zoom-indicator');
    el.textContent = Math.round(currentZoom * 100) + '%';
    el.classList.add('show');
    clearTimeout(zoomTimer);
    zoomTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

/* ── 도구 / 색상 / 크기 ── */
function setTool(t) {
    tool = t;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + t)?.classList.add('active');

    const wrap = document.getElementById('canvas-wrap');
    pages.forEach(p => {
        p.canvas.classList.toggle('eraser-cursor', t === 'eraser');
    });

    // 지우개일 때 사이즈 의미 바꿔주기
    updateToolInfo();
}

function setColor(btn) {
    penColor = btn.dataset.color;
    document.querySelectorAll('.color-btn').forEach(b => {
        b.classList.remove('active');
        b.style.borderColor = 'transparent';
    });
    btn.classList.add('active');
    btn.style.borderColor = '#fff';
    if (tool === 'eraser') setTool('pen');
}

function setSize(s) {
    penSize = s;
    const ids = ['sz-1','sz-2','sz-3','sz-4'];
    const sizes = [1.5, 3, 6, 12];
    ids.forEach((id, i) => {
        document.getElementById(id)?.classList.toggle('active', sizes[i] === s);
    });
    updateToolInfo();
}

function setOpacity(val) {
    penOpacity = val / 100;
    document.getElementById('opacity-val').textContent = val + '%';
}

function updatePageInfo() {
    document.getElementById('page-info').textContent =
        `페이지 ${currentPageIdx + 1} / ${pages.length}`;
}

function updateToolInfo() {
    const toolNames = { pen: '펜', highlighter: '형광펜', eraser: '지우개', select: '선택' };
    document.getElementById('tool-info').textContent =
        `${toolNames[tool] || tool} · ${penSize}px`;
}

/* ── 저장 (PNG로 각 페이지 내보내기) ── */
function saveAllPages() {
    pages.forEach((page, i) => {
        const link = document.createElement('a');
        link.download = `note_page_${i + 1}.png`;
        link.href = page.canvas.toDataURL('image/png');
        link.click();
    });
}

/* ── 키보드 단축키 ── */
document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') { e.preventDefault(); undo(); }
        if (e.key === 'y') { e.preventDefault(); redo(); }
        if (e.key === '=') { e.preventDefault(); adjustZoom(0.25); }
        if (e.key === '-') { e.preventDefault(); adjustZoom(-0.25); }
        if (e.key === '0') { e.preventDefault(); resetZoom(); }
    }
    if (e.key === 'p') setTool('pen');
    if (e.key === 'h') setTool('highlighter');
    if (e.key === 'e') setTool('eraser');
});

/* ── 스크롤로 현재 페이지 감지 ── */
document.getElementById('canvas-wrap').addEventListener('scroll', () => {
    const wrap = document.getElementById('canvas-wrap');
    const wrapTop = wrap.scrollTop + wrap.clientHeight / 2;

    let best = 0, bestDist = Infinity;
    pages.forEach((p, i) => {
        const rect = p.canvas.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const canvasCenter = (rect.top - wrapRect.top) + rect.height / 2 + wrap.scrollTop;
        const dist = Math.abs(canvasCenter - wrapTop);
        if (dist < bestDist) { bestDist = dist; best = i; }
    });

    if (best !== currentPageIdx) {
        currentPageIdx = best;
        updatePageInfo();
    }
});

/* ── 시작 ── */
init();
</script>
</body>
